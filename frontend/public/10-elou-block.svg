    <text class="stage" x="156" y="50">I ступень</text><text class="stage" x="364" y="50">II ступень</text>
    <path class="pipe" d="M20 250H110M158 250H252M252 106V394M252 250H320M368 250H500"/>
    <path class="pipe" d="M158 134H215V250M158 390H215V250M368 134H424V250M368 390H424V250"/>
    <g transform="translate(110 78)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-5</text></g>
    <g transform="translate(110 206)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-3</text></g>
    <g transform="translate(110 334)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-1</text></g>
    <g transform="translate(320 78)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-6</text></g>
    <g transform="translate(320 206)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-4</text></g>
    <g transform="translate(320 334)"><use href="#electrodehydrator" xlink:href="#electrodehydrator"/><rect class="label-card" x="60" y="35" width="58" height="38" rx="7"/><text class="label" x="89" y="54">Э-2</text></g>
  </g>
